<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relatório de Entrada</title>
<style>
:root{--red:#c8102e;--red-d:#7d0a1c;--yel:#ffc72c;--yel-l:#fff3cc;--bg:#f5f2ea;--card:#fff;--tx:#241616;--mut:#7b6c62;--bd:#e7e0d0;--neg:#c8102e;--sh:0 1px 2px rgba(36,22,22,.06),0 6px 20px rgba(36,22,22,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110a;--card:#241b10;--tx:#fbf0d4;--mut:#c5b184;--bd:#4a3a15;--yel-l:#3d3209;--neg:#ff7a7a;--sh:none}}
:root[data-theme="dark"]{--bg:#17110a;--card:#241b10;--tx:#fbf0d4;--mut:#c5b184;--bd:#4a3a15;--yel-l:#3d3209;--neg:#ff7a7a;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--red);background:linear-gradient(115deg,var(--red-d),var(--red));color:#fff;padding:20px 20px 22px;border-bottom:5px solid var(--yel)}
.hw{max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:46px;height:46px;border-radius:12px;background:var(--yel);color:var(--red-d);display:grid;place-items:center;font-weight:900;font-size:18px;letter-spacing:-1px}
.eye{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;opacity:.85;font-weight:600}
header h1{margin:0;font-size:clamp(22px,4vw,30px);letter-spacing:-.4px;font-weight:800}
.st{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600}
.st i{width:9px;height:9px;border-radius:50%;background:var(--yel);box-shadow:0 0 0 0 rgba(255,199,44,.7);animation:pl 1.8s infinite}
.st.off i{animation:none;background:#bbb}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(255,199,44,0)}100%{box-shadow:0 0 0 0 rgba(255,199,44,0)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:4px 12px;border-radius:8px;font-size:12.5px}
main{max-width:1400px;margin:0 auto;padding:16px}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:14px;box-shadow:var(--sh)}
.tab{border:0;background:none;color:var(--mut);padding:9px 20px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.tab.on{background:var(--red);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--red);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--tx);font:inherit;box-shadow:var(--sh)}
.kpi:nth-child(2){border-top-color:var(--yel)}
.kpi b{display:block;font-size:30px;line-height:1.1;font-weight:800}
.kpi span{font-size:12.5px;color:var(--mut);font-weight:600}
.kpi.on{background:var(--yel-l);outline:2px solid var(--red)}
.tool{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:13.5px;font-family:inherit}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.yel{background:var(--yel);border-color:var(--yel);color:#3a0a0a}
.btn:hover{filter:brightness(.95)}
input[type=search],select{padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:14px;min-width:0;font-family:inherit}
input[type=search]{flex:1 1 220px}
label.tg{font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer;font-weight:600}
.prog{flex:1 1 100%;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mut);font-weight:600}
.pb{flex:1;height:8px;background:var(--bd);border-radius:9px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yel),var(--red));transition:width .4s}
.drop{border:1.5px dashed var(--red);border-radius:12px;padding:11px;text-align:center;background:var(--yel-l);margin-bottom:12px;font-weight:600;font-size:13.5px}
.drop.over{background:var(--yel)}
.count{font-size:13px;color:var(--mut);margin:4px 2px 8px;font-weight:600}
.wrap{background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--red-d);color:#fff;padding:10px 8px;text-align:left;cursor:pointer;white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px}
td{padding:8px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr.g td{background:var(--yel);color:#3a0a0a;font-weight:800;font-size:13px;padding:7px 12px;letter-spacing:.3px;text-transform:uppercase}
tr.g small{font-weight:700;opacity:.7;margin-left:8px;text-transform:none}
tr.it td:first-child{border-left:5px solid transparent}
tr.sy td:first-child{border-left-color:var(--yel)}
tr.sr td:first-child{border-left-color:var(--red)}
tr.it:hover td{background:var(--yel-l)}
tr.done{opacity:.45}tr.done .pr b{text-decoration:line-through}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.neg{color:var(--neg);font-weight:800}
.pw{display:flex;gap:10px;align-items:center}
.pr b{display:block;font-size:13.5px}.pr small{color:var(--mut);font-size:11.5px}
.th{width:38px;height:38px;border-radius:8px;object-fit:cover;cursor:zoom-in;flex:none;border:1px solid var(--bd)}
.cam{width:38px;height:38px;border-radius:8px;border:1.5px dashed var(--bd);background:none;cursor:pointer;flex:none;font-size:15px}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--red);cursor:pointer}
.bd{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;margin:1px 3px 1px 0;white-space:nowrap}
.bd.y{background:var(--yel);color:#3a0a0a}.bd.r{background:var(--red);color:#fff}.bd.o{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.leg{margin-top:14px;font-size:12px;color:var(--mut);line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ph{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column}
.pi{aspect-ratio:4/3;background:var(--yel-l);display:grid;place-items:center;cursor:pointer;overflow:hidden;color:var(--mut);font-size:13px;font-weight:600;border:0;width:100%}
.pi img{width:100%;height:100%;object-fit:cover}
.pc{padding:10px 12px}.pc b{display:block;font-size:13.5px}.pc small{color:var(--mut);font-size:11.5px}
#lb{position:fixed;inset:0;background:rgba(20,8,8,.88);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:70vh;border-radius:12px}
#lb p{color:#fff;margin:0;font-weight:700;text-align:center}
#lb div{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--red-d);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:60;display:none;max-width:90vw}
.pt{display:none}
[hidden]{display:none!important}
@media (max-width:760px){
 thead{display:none}
 table,tbody,tr,td{display:block}
 tr.it{display:grid;grid-template-columns:28px 1fr 1fr;gap:2px 8px;padding:10px 12px;border-bottom:1px solid var(--bd)}
 tr.it td{border:0!important;padding:2px 0}
 tr.it td.ck{grid-column:1;grid-row:1}
 tr.it td.pr{grid-column:2/4;grid-row:1}
 tr.it td.cd,tr.it td.x{display:none}
 tr.it td.n{text-align:left;font-size:12.5px}
 tr.it td.n:before{content:attr(data-l) ": ";color:var(--mut);font-size:11px}
 tr.it td.al{grid-column:1/4}
 .st{margin-left:0}
}
@media print{
 @page{size:A4 landscape;margin:8mm}
 body{background:#fff;color:#000}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 header{padding:6px 0;background:#fff!important;color:#000;border-bottom:4px solid var(--red)}
 .logo{width:30px;height:30px;font-size:12px}.eye{opacity:1}
 header h1{font-size:18px}.chip{background:none;border:0;color:#000;padding:0 10px 0 0;font-size:11px}
 .tool,.drop,.kpis,.count,.noprint,.tabs,.st,#lb,#toast{display:none!important}
 .pt{display:block;font-size:11px;margin:4px 0}
 main{padding:0;max-width:none}
 .wrap{box-shadow:none;border-radius:0}
 table{font-size:9.5px}thead{display:table-header-group}
 th{background:var(--red-d)!important;color:#fff!important;padding:4px}
 td{padding:3px 4px}.th{width:24px;height:24px}
 tr{break-inside:avoid}tr.g{break-after:avoid}
 tr.it:hover td{background:none}tr.done{opacity:1}
 .grid{grid-template-columns:repeat(4,1fr);gap:8px}.ph{box-shadow:none;break-inside:avoid}.ph.no{display:none}
 .leg{color:#000;font-size:9px}
}
</style>
</head>

<div id="lb"><img id="lbi" alt=""><p id="lbp"></p><div><button class="btn yel" id="lbr">Trocar foto</button><button class="btn" id="lbd">Remover</button><button class="btn red" id="lbx">Fechar</button></div></div>

function parse(aoa){
 const h=aoa.findIndex(r=>String(r[0]).trim()==='Código');
 if(h<0)throw new Error('cabeçalho "Código" não encontrado');

 const title=aoa.slice(0,h).map(r=>cl(r).filter(x=>x!=='').join(' ')).filter(Boolean);
 const rows=[],legend=[];let inL=false;
 for(let i=h+1;i<aoa.length;i++){const r=cl(aoa[i]),f=String(r[0]);
  if(f.startsWith('LEGENDA'))inL=true;
  if(inL){const t=r.filter(x=>x!=='').join(' ');if(t)legend.push(t)}else if(f!=='')rows.push(r)}
 const headers=cl(aoa[h]).map(String);
 if(!headers.some(x=>/produto/i.test(x)))throw new Error('coluna "Produto" não encontrada');
 return{title,headers,rows,legend}}
const ix=re=>D.headers.findIndex(h=>re.test(h));

const KP=[['','Todos os itens',()=>true],['SEM VENDA','Sem venda em 30 dias',r=>has(r,'SEM VENDA')],['<12UN','Estoque abaixo de 12 un',r=>has(r,'<12UN')],['<4DIAS','Menos de 4 dias de estoque',r=>has(r,'<4DIAS')]];

function filtered(){
 const c=C(),q=$('q').value.toLowerCase().trim(),dp=$('dep').value,hd=$('hide').checked,pf=$('pf').value,k=KP.find(x=>x[0]===flt)||KP[0];
 let r=D.rows.filter(x=>(tab==='fot'||k[2](x))&&(!dp||x[c.dep]===dp)&&(tab==='fot'||!hd||!isDone(idOf(x)))&&(tab==='rel'||!pf||(pf==='com')===!!PH[sid(idOf(x))])&&(!q||x.join(' ').toLowerCase().includes(q)));
 if(sortI>=0&&tab==='rel')r=[...r].sort((a,b)=>{const x=a[sortI],y=b[sortI],nx=typeof x==='number',ny=typeof y==='number';
  if(nx&&ny)return(x-y)*sortD;if(nx!==ny)return nx?-1:1;return String(x).localeCompare(String(y),'pt')*sortD});
 return r}
const COLS=()=>{const c=C();return[['✔',-1,'noprint'],['Código',c.cod,'x'],['Produto',c.prod],['Entrou',c.ent],['Estoque D-2',c.est],['Venda 30d',c.ven],['Dias c/ venda',c.dcv,'x'],['Média/dia',c.med],['Dias estoque',c.die],['Alertas',c.al]]};
function status(){const s=$('st');

function render(){
 const c=C(),t=D.title;

  const g={};r.forEach(x=>(g[x[c.dep]||'Sem departamento']=g[x[c.dep]||'Sem departamento']||[]).push(x));
  const n=COLS().length;let h='';
  Object.keys(g).sort().forEach(d=>{
   h+=`<tr class="g"><td colspan="${n}">${esc(d)}<small>${g[d].length} ${g[d].length>1?'itens':'item'}</small></td></tr>`;
   g[d].forEach(x=>{const k=idOf(x),s=sid(k),sv=has(x,'SEM VENDA')?'sy':(has(x,'<12UN')||has(x,'<4DIAS')?'sr':''),dn=isDone(k),nm=(v,l,cl='')=>`<td class="n ${cl} ${typeof v==='number'&&v<0?'neg':''}" data-l="${l}">${fmt(v)}</td>`;
    const th=PH[s]?`<img class="th" src="${PH[s]}" data-lb="${esc(k)}" alt="">`:(db&&canW?`<button class="cam noprint" data-cam="${esc(k)}" title="Adicionar foto">📷</button>`:'');
    h+=`<tr class="it ${sv} ${dn?'done':''}"><td class="ck noprint"><input type="checkbox" data-id="${esc(k)}" ${dn?'checked':''} ${db&&!canW?'disabled':''}></td>

    <td class="al">${badges(x[c.al])}</td></tr>`})});
  $('body').innerHTML=h||`<tr><td colspan="${n}" style="padding:20px;text-align:center">Nenhum item encontrado.</td></tr>`;
  const dn=D.rows.filter(x=>isDone(idOf(x))).length,pc=D.rows.length?Math.round(dn/D.rows.length*100):0;
  $('pg').textContent=`${dn} de ${D.rows.length} abastecidos (${pc}%)`;$('pbar').style.width=pc+'%';
  const k=KP.find(x=>x[0]===flt);txt=`${r.length} de ${D.rows.length} itens${flt?' · '+k[1]:''}${$('dep').value?' · '+$('dep').value:''}`;

  const np=D.rows.filter(x=>PH[sid(idOf(x))]).length;

   return`<div class="ph ${p?'':'no'}"><button class="pi" ${p?`data-lb="${esc(k)}"`:(db&&canW?`data-cam="${esc(k)}"`:'disabled')}>${p?`<img src="${p}" alt="">`:(db&&canW?'📷 Adicionar foto':'Sem foto')}</button>
   <div class="pc"><b>${esc(x[c.prod])}</b><small>${esc(x[c.cod])} · ${esc(x[c.dep]||'')}</small><div>${badges(x[c.al])}</div></div></div>`}).join('')||'<p>Nenhum produto encontrado.</p>';
  txt=`${r.length} produtos · ${np} de ${D.rows.length} com foto`}

function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
  cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);let q=.75,o=cv.toDataURL('image/jpeg',q);
  while(o.length>170000&&q>.3){q-=.1;o=cv.toDataURL('image/jpeg',q)}URL.revokeObjectURL(u);o.length>230000?no(new Error('foto muito grande')):ok(o)};
 im.onerror=()=>no(new Error('imagem inválida'));im.src=u})}
function pick(code){const i=document.createElement('input');i.type='file';i.accept='image/*';

function load(f){if(!f)return;const rd=new FileReader();rd.onload=async e=>{try{
 const wb=XLSX.read(e.target.result,{type:'array'});
 const nd=parse(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}));

 if(db&&canW){const js=JSON.stringify(nd);if(js.length>240000)throw new Error('planilha grande demais');
  await db.doc('report/current').set({json:js,rid:Date.now().toString(36),name:f.name,ts:Date.now()});toast('Planilha publicada para todos ✔')}
