<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Auditoria e Validação de Estoque ERP</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --accent: #10b981;
      --border: #232d42;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header { background: #070a12; padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; letter-spacing: 0.5px; }
    .brand i { color: var(--accent); }

    .nav-tabs { display: flex; gap: 6px; background: #0d1322; padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
    .tab-btn { background: transparent; color: var(--text-muted); border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .tab-btn.active { background: var(--card-bg); color: var(--accent); }

    .dashboard { flex: 1; display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px; width: 100%; max-width: 1600px; margin: 0 auto; }

    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .panel-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    input, select { background: #0b0f19; border: 1px solid var(--border); color: white; padding: 9px 12px; border-radius: 6px; outline: none; font-size: 0.85rem; }
    input:focus { border-color: var(--accent); }

    .sector-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { background: #0b0f19; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: 600; }
    .pill.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .signature-box { background: #ffffff; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid var(--border); min-height: 55px; display: flex; align-items: center; justify-content: center; }
    .signature-text { font-family: 'Great Vibes', cursive; font-size: 1.8rem; color: #0f172a; }

    .btn { padding: 10px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.85rem; transition: 0.2s; }
    .btn-accent { background: var(--accent); color: #000; }
    .btn-accent:hover { opacity: 0.9; }
    .btn-secondary { background: #1e293b; color: white; border: 1px solid var(--border); }
    .btn-secondary:hover { background: #2d3d59; }

    /* Barra de Ferramentas */
    .toolbar { display: flex; gap: 8px; background: #0d1322; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px; align-items: center; }
    .tool-btn { background: #151c2c; color: var(--text-muted); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .tool-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .canvas-container-box { background: #070a12; border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; padding: 12px; overflow: hidden; }
    .canvas-viewport { flex: 1; display: flex; justify-content: center; align-items: center; min-height: 520px; width: 100%; position: relative; }

    .view-section { display: none; }
    .view-section.active { display: flex; flex-direction: column; gap: 12px; }

    /* Modal de Acesso */
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 9999; display: none; justify-content: center; align-items: center; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 340px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
  </style>
</head>
<body>

<header>
  <div class="brand"><i class="fa-solid fa-file-invoice"></i> AUDITORIA DE ESTOQUE ERP</div>
  <div class="nav-tabs">
    <button class="tab-btn active" id="tab-op-btn" onclick="switchTab('user')"><i class="fa-solid fa-user-check"></i> Operacional</button>
    <button class="tab-btn" id="tab-adm-btn" onclick="requestADMAuth()"><i class="fa-solid fa-lock"></i> Gestão ADM</button>
  </div>
</header>

<div class="dashboard">

  <div class="panel">
    
    <!-- OPERAÇÃO -->
    <div id="sidebar-user" class="view-section active">
      <div class="panel-title"><i class="fa-solid fa-id-card"></i> Identificação do Auditor</div>
      
      <div class="form-group">
        <label>Nome do Responsável</label>
        <input type="text" id="op-fullname" placeholder="Ex: Gabriel Silva" oninput="updateSignaturePreview()">
      </div>

      <div class="form-group">
        <label>Chancela Manuscrita</label>
        <div class="signature-box">
          <div class="signature-text" id="signature-preview">Gabriel Silva</div>
        </div>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-layer-group"></i> Filtrar Setor do ERP</label>
        <div class="sector-pills">
          <span class="pill active" onclick="filterSector('TODOS', this)">TODOS</span>
          <span class="pill" onclick="filterSector('BEBIDAS', this)">01 - BEBIDAS</span>
          <span class="pill" onclick="filterSector('MERCEARIA', this)">02 - MERCEARIA</span>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
        <button class="btn btn-secondary" onclick="addPrecisionMarker()"><i class="fa-solid fa-highlighter"></i> Destacar Linha Divergência</button>
        <button class="btn btn-accent" onclick="applySignatureToCanvas()"><i class="fa-solid fa-stamp"></i> Aplicar Assinatura Digital</button>
      </div>

      <button class="btn btn-accent" style="background:#22c55e; color:#000; margin-top:auto;" onclick="exportHDImage()">
        <i class="fa-solid fa-file-export"></i> Exportar Laudo Final
      </button>
    </div>

    <!-- ADM EXTERNO -->
    <div id="sidebar-adm" class="view-section">
      <div class="panel-title"><i class="fa-solid fa-sliders"></i> Controle de Arquivo Externo</div>
      
      <div class="form-group">
        <label>Carregar Relatório em Imagem</label>
        <input type="file" id="adm-upload-input" accept="image/*">
      </div>

      <div class="form-group">
        <label>Laudo Padrão para Divergências</label>
        <input type="text" id="adm-default-laudo" value="DIVERGÊNCIA DE ESTOQUE CONFIRMADA">
      </div>

      <button class="btn btn-accent" onclick="saveADMChanges()"><i class="fa-solid fa-save"></i> Salvar Parâmetros</button>
      <button class="btn btn-secondary" onclick="logoutADM()" style="margin-top: auto;"><i class="fa-solid fa-sign-out-alt"></i> Sair do Painel ADM</button>
    </div>

  </div>

  <!-- CONTAINER CENTRAL DE AUDITORIA -->
  <div class="canvas-container-box">
    
    <div class="toolbar">
      <button class="tool-btn active" id="btn-select" onclick="setMode('select')"><i class="fa-solid fa-mouse-pointer"></i> Selecionar</button>
      <button class="tool-btn" id="btn-draw" onclick="setMode('draw')"><i class="fa-solid fa-pencil"></i> Desenho Livre</button>
      <button class="tool-btn" onclick="addText()"><i class="fa-solid fa-font"></i> Anotação</button>
      <button class="tool-btn" onclick="deleteSelected()"><i class="fa-solid fa-trash-can"></i> Remover</button>
      <button class="tool-btn" style="margin-left:auto; background:#1e293b;" onclick="clearCanvasAnnotations()"><i class="fa-solid fa-rotate-left"></i> Limpar Anotações</button>
    </div>

    <div class="canvas-viewport" id="viewport-container">
      <canvas id="main-canvas"></canvas>
    </div>

  </div>

</div>

<!-- MODAL LOGIN ADM -->
<div class="modal-overlay" id="adm-modal">
  <div class="modal-card">
    <h3 style="margin-bottom:14px; font-size:1rem;"><i class="fa-solid fa-lock"></i> Autenticação ADM</h3>
    <div class="form-group" style="margin-bottom:10px;">
      <label>Usuário</label>
      <input type="text" id="adm-user">
    </div>
    <div class="form-group" style="margin-bottom:16px;">
      <label>Senha</label>
      <input type="password" id="adm-pass">
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-accent" style="flex:1;" onclick="loginADM()">Acessar</button>
      <button class="btn btn-secondary" onclick="closeADMModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
  let canvas;
  let isLoggedADM = false;
  let loadedImageObject = null;
  let activeSector = 'TODOS';

  window.onload = function() {
    canvas = new fabric.Canvas('main-canvas', { selection: true });
    canvas.freeDrawingBrush.color = '#ef4444';
    canvas.freeDrawingBrush.width = 2;

    resizeCanvasToContainer();
    window.addEventListener('resize', resizeCanvasToContainer);
  };

  function resizeCanvasToContainer() {
    const container = document.getElementById('viewport-container');
    canvas.setWidth(container.clientWidth - 10);
    canvas.setHeight(container.clientHeight - 10);
    if (loadedImageObject) fitImageToCanvas(loadedImageObject);
    canvas.renderAll();
  }

  function fitImageToCanvas(img) {
    const scale = Math.min((canvas.width - 10) / img.width, (canvas.height - 10) / img.height);
    img.set({
      scaleX: scale,
      scaleY: scale,
      left: (canvas.width - (img.width * scale)) / 2,
      top: (canvas.height - (img.height * scale)) / 2,
      selectable: false,
      evented: false,
      isBaseImage: true
    });
  }

  function setMode(mode) {
    document.getElementById('btn-select').classList.toggle('active', mode === 'select');
    document.getElementById('btn-draw').classList.toggle('active', mode === 'draw');
    canvas.isDrawingMode = (mode === 'draw');
  }

  function addText() {
    setMode('select');
    const text = new fabric.IText('Anotação de Auditoria', {
      left: 150, top: 150, fontSize: 13, fill: '#ef4444', backgroundColor: '#ffffff',
      padding: 4, sector: activeSector
    });
    canvas.add(text);
    canvas.setActiveObject(text);
  }

  function deleteSelected() {
    const active = canvas.getActiveObjects();
    if (active.length) {
      active.forEach(obj => { if (!obj.isBaseImage) canvas.remove(obj); });
      canvas.discardActiveObject();
      canvas.renderAll();
    }
  }

  function clearCanvasAnnotations() {
    canvas.getObjects().forEach(obj => {
      if (!obj.isBaseImage) canvas.remove(obj);
    });
    canvas.renderAll();
  }

  // Upload pelo ADM
  document.getElementById('adm-upload-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      fabric.Image.fromURL(evt.target.result, function(img) {
        canvas.clear();
        loadedImageObject = img;
        fitImageToCanvas(img);
        canvas.add(img);
        canvas.sendToBack(img);
        canvas.renderAll();
      });
    };
    reader.readAsDataURL(file);
  });

  // Autenticação ADM
  function requestADMAuth() {
    if (isLoggedADM) switchTab('adm');
    else document.getElementById('adm-modal').style.display = 'flex';
  }

  function closeADMModal() { document.getElementById('adm-modal').style.display = 'none'; }

  function loginADM() {
    const u = document.getElementById('adm-user').value;
    const p = document.getElementById('adm-pass').value;
    if (u === 'admin' && p === 'admin123') {
      isLoggedADM = true;
      closeADMModal();
      switchTab('adm');
    } else {
      alert("Credenciais inválidas.");
    }
  }

  function logoutADM() {
    isLoggedADM = false;
    switchTab('user');
  }

  function switchTab(mode) {
    document.getElementById('tab-op-btn').classList.toggle('active', mode === 'user');
    document.getElementById('tab-adm-btn').classList.toggle('active', mode === 'adm');
    document.getElementById('sidebar-user').classList.toggle('active', mode === 'user');
    document.getElementById('sidebar-adm').classList.toggle('active', mode === 'adm');
  }

  function updateSignaturePreview() {
    const name = document.getElementById('op-fullname').value.trim();
    document.getElementById('signature-preview').innerText = name ? name : "Gabriel Silva";
  }

  // Destaque de Precisão Hi-Tech (Marca-texto fino sobre a linha da tabela)
  function addPrecisionMarker() {
    const laudoText = document.getElementById('adm-default-laudo').value;

    const rect = new fabric.Rect({
      width: canvas.width * 0.7,
      height: 18,
      fill: 'rgba(239, 68, 68, 0.25)',
      stroke: '#ef4444',
      strokeWidth: 1,
      rx: 3, ry: 3
    });

    const tag = new fabric.Text(` [AUDITORIA]: ${laudoText} `, {
      fontSize: 10,
      fill: '#ffffff',
      backgroundColor: '#ef4444',
      left: 0,
      top: -16,
      fontWeight: '600'
    });

    const group = new fabric.Group([rect, tag], {
      left: (canvas.width - (canvas.width * 0.7)) / 2,
      top: 180 + (Math.random() * 40),
      sector: activeSector
    });

    canvas.add(group);
    canvas.setActiveObject(group);
    canvas.renderAll();
  }

  // Chancela Digital com Validação Oficial
  function applySignatureToCanvas() {
    const name = document.getElementById('op-fullname').value.trim() || "Gabriel Silva";
    const now = new Date();
    const stampDate = `${now.toLocaleDateString('pt-BR')} ${now.toLocaleTimeString('pt-BR')}`;
    const hash = Math.random().toString(36).substring(2, 10).toUpperCase();

    const signText = new fabric.Text(name, {
      fontFamily: 'Great Vibes',
      fontSize: 26,
      fill: '#0f172a'
    });

    const metaText = new fabric.Text(`AUDITADO VIA CHANCELA DIGITAL\nDATA: ${stampDate} | SHA: ${hash}`, {
      fontSize: 8,
      fill: '#334155',
      top: 30,
      fontFamily: 'sans-serif',
      fontWeight: '600'
    });

    const group = new fabric.Group([signText, metaText], {
      left: canvas.width - 260,
      top: canvas.height - 70,
      backgroundColor: 'rgba(255, 255, 255, 0.95)',
      padding: 8,
      sector: 'TODOS'
    });

    canvas.add(group);
    canvas.renderAll();
  }

  // Filtro de Setor por Ocultação Dinâmica dos Elementos de Marcação
  function filterSector(sector, element) {
    activeSector = sector;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    element.classList.add('active');

    canvas.getObjects().forEach(obj => {
      if (obj.isBaseImage) return;
      if (sector === 'TODOS' || !obj.sector || obj.sector === 'TODOS' || obj.sector === sector) {
        obj.visible = true;
      } else {
        obj.visible = false;
      }
    });

    canvas.discardActiveObject();
    canvas.renderAll();
  }

  function saveADMChanges() {
    alert("Parâmetros do ADM atualizados!");
    switchTab('user');
  }

  function exportHDImage() {
    if (!canvas.getObjects().length) return alert("Carregue o relatório antes de exportar.");

    const dataURL = canvas.toDataURL({ format: 'png', quality: 1.0, multiplier: 2 });
    const link = document.createElement('a');
    link.download = `LAUDO_AUDITORIA_ESTOQUE_${Date.now()}.png`;
    link.href = dataURL;
    link.click();
  }
</script>
</body>
</html>
